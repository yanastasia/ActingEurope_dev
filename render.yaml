databases:
  - name: actingeurope-db
    databaseName: actingeurope
    user: actingeurope_user
    plan: free
    engine: postgres

services:
  - type: web
    name: actingeurope-web
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: actingeurope-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        value: https://actingeurope-web.onrender.com
    autoDeploy: false